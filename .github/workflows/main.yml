name: SafeBase CI/CD
# it shouldwork maintenant
on:
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  CI_LOG: ${{ github.workspace }}/ci.log

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialiser le journal CI
        run: |
          : > "$CI_LOG"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$CI_LOG"
          echo "Commit: $GITHUB_SHA" >> "$CI_LOG"

      # 2. Les étapes sont séquentielles : un échec arrête le job et empêc
      #    le build et le push de l'image.
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances du serveur
        working-directory: server
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a "$CI_LOG"

      - name: Tester le serveur
        working-directory: server
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a "$CI_LOG"

      - name: Configurer Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Construire et tester le worker Go
        working-directory: worker-go
        run: |
          set -o pipefail
          IMAGE_NAMESPACE="$(printf '%s' "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          {
            go build ./...
            go test ./...
          } 2>&1 | tee -a "$CI_LOG"

      - name: Installer et construire le client
        working-directory: client
        run: |
          set -o pipefail
          {
            npm ci
            npm run build
          } 2>&1 | tee -a "$CI_LOG"

      - name: Normaliser le namespace GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_NAMESPACE=$(printf '%s' "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Le tag est normalisé afin de rester valide comme tag Docker, y compris
      # lorsque le nom du tag Git contient des slashs.
      - name: Déterminer les tags Docker
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            safe_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | cut -c1-100)"
            channel="prod"
            version_tag="${channel}-${safe_tag}"
          else
            channel="dev"
            version_tag="${channel}-${GITHUB_SHA}"
          fi

          {
            echo "channel=$channel"
            echo "version_tag=$version_tag"
            echo "latest_tag=${channel}-latest"
          } >> "$GITHUB_OUTPUT"

      # 3-4. Construction et publication des images applicatives sur GHCR.
      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser les images Docker
        env:
          VERSION_TAG: ${{ steps.image-tags.outputs.version_tag }}
          LATEST_TAG: ${{ steps.image-tags.outputs.latest_tag }}
        run: |
          set -o pipefail
          {
            docker build \
              --tag "$REGISTRY/$IMAGE_NAMESPACE/safebase-server:$VERSION_TAG" \
              --tag "$REGISTRY/$IMAGE_NAMESPACE/safebase-server:$LATEST_TAG" \
              ./server
            docker build \
              --tag "$REGISTRY/$IMAGE_NAMESPACE/safebase-client:$VERSION_TAG" \
              --tag "$REGISTRY/$IMAGE_NAMESPACE/safebase-client:$LATEST_TAG" \
              ./client
            docker build \
              --tag "$REGISTRY/$IMAGE_NAMESPACE/safebase-worker:$VERSION_TAG" \
              --tag "$REGISTRY/$IMAGE_NAMESPACE/safebase-worker:$LATEST_TAG" \
              ./worker-go

            docker push "$REGISTRY/$IMAGE_NAMESPACE/safebase-server:$VERSION_TAG"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/safebase-server:$LATEST_TAG"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/safebase-client:$VERSION_TAG"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/safebase-client:$LATEST_TAG"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/safebase-worker:$VERSION_TAG"
            docker push "$REGISTRY/$IMAGE_NAMESPACE/safebase-worker:$LATEST_TAG"
          } 2>&1 | tee -a "$CI_LOG"

      # 5. Connexion au réseau privé via Tailscale pour atteindre le VPS.
      - name: Connexion au réseau Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Vérifier la connectivité Tailscale
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" ]]; then
            echo "VPS_HOST n'est pas configuré." >&2
            exit 1
          fi
          port="${VPS_PORT:-22}"
          echo "Réseau Tailscale actif:"
          tailscale status
          echo "Test SSH via Tailscale vers $VPS_HOST:$port..."
          timeout 10 bash -c "</dev/tcp/$VPS_HOST/$port"

      # 6. Déploiement SSH sur le VPS
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          LATEST_TAG: ${{ steps.image-tags.outputs.latest_tag }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || '22' }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: "30s"
          command_timeout: "10m"
          script_stop: true
          envs: REGISTRY,IMAGE_NAMESPACE,LATEST_TAG,VPS_DEPLOY_PATH
          script: |
            set -e
            DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/safebase}"
            cd "$DEPLOY_PATH"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

            export SERVER_IMAGE="$REGISTRY/$IMAGE_NAMESPACE/safebase-server:$LATEST_TAG"
            export CLIENT_IMAGE="$REGISTRY/$IMAGE_NAMESPACE/safebase-client:$LATEST_TAG"
            export WORKER_IMAGE="$REGISTRY/$IMAGE_NAMESPACE/safebase-worker:$LATEST_TAG"
            export SERVER_PULL_POLICY=always
            export CLIENT_PULL_POLICY=always
            export WORKER_PULL_POLICY=always

            if [ -f "docker-compose.yml" ] || [ -f "compose.yaml" ]; then
              docker compose pull
              docker compose up -d --remove-orphans --pull always
            else
              echo "Erreur: Aucun fichier docker-compose trouvé dans $DEPLOY_PATH." >&2
              exit 1
            fi

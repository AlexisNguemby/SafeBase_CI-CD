name: SafeBase CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Validation du serveur Node.js.
  check-server-node:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: server
        run: npm ci

      - name: Exécuter les tests
        working-directory: server
        run: npm test

  # Compilation et tests du worker Go.
  check-worker-go:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Compiler le worker
        working-directory: worker-go
        run: go build ./...

      - name: Exécuter les tests
        working-directory: worker-go
        run: go test ./...

  # Validation de la construction du client web.
  check-client-web:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: client
        run: npm ci

      - name: Construire le client
        working-directory: client
        run: npm run build --if-present

  # Publication des images uniquement après la réussite des trois validations.
  deploy-docker-images:
    needs:
      - check-server-node
      - check-worker-go
      - check-client-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Convertir le propriétaire en minuscules
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE_OWNER=${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image serveur
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/safebase-server:latest

      - name: Construire et pousser l'image client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/safebase-client:latest

      - name: Construire et pousser l'image worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker-go
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/safebase-worker:latest
